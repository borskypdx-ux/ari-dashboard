name: Research – fetch historical ARI sources

# Dočasný průzkumný workflow: spouští se pushem změny skriptu/triggeru
# na pracovní větev (workflow_dispatch funguje jen pro workflow na main).
on:
  push:
    branches: [claude/week-calculation-fix-6nggqk]
    paths: ["scripts/research_*.py", "research/.trigger"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-fetch
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 pdfplumber openpyxl xlrd
      - run: python scripts/research_fetch.py
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/
          git diff --cached --quiet && exit 0
          git commit -m "research: raw source snapshot"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
